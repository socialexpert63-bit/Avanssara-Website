{id:'D-103',t:'Delta Fabrication',ty:'Buy-side',v:'$15M rev',st:2},{id:'D-104',t:'Summit Business Solutions',ty:'Sell-side',v:'$14M rev',st:4},
{id:'D-105',t:'Permian Field Logistics',ty:'Buy-side',v:'$31M rev',st:6},{id:'D-106',t:'Ridgeline Controls',ty:'Buy-side',v:'$9M rev',st:1},
{id:'D-107',t:'Horizon Pipeline Add-on',ty:'Buy-side',v:'$28M rev',st:8}];
